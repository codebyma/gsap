<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>GSAP ScrollTrigger Sample</title>
	<style>
		body {
			margin: 0;
			height: 200vh;
			font-family: sans-serif;
		}

		section {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #111;
			color: white;
		}

		.box {
			width: 150px;
			height: 150px;
			background: #4ade80;
		}

		.text {

			font-size: 16px;
			color: #fff
		}

		.spacer {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2rem;
		}

		.section {
			/* border-top: 10px solid #fff */
		}
	</style>
</head>

<body>

	<section>
		<h1>스크롤 내려보세요 ↓</h1>
	</section>

	<section class="trigger">
		<div class="box"></div>
	</section>

	<section class="section">
		<div class="text-wrapper">
			<p class="text left">왼쪽에서 등장</p>
			<p class="text right">오른쪽에서 등장</p>
		</div>
	</section>

	<div class="spacer">끝</div>

	<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
	<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
	<script>
		gsap.registerPlugin(ScrollTrigger);

		gsap.to(".box", {
			x: 400,
			rotation: 360,
			scale: 1.5,
			scrollTrigger: {
				trigger: ".trigger",   // 기준 요소
				start: "top center",   // 트리거 시작 지점
				end: "bottom top",     // 트리거 끝 지점
				scrub: true,           // 스크롤과 애니메이션 동기화
				pin: true,             // 섹션 고정
				//markers: true          // 개발용 마커 (배포 시 제거)
			}
		});

		gsap.utils.toArray(".section").forEach(section => {
			// 1️⃣ section 전체 pin
			ScrollTrigger.create({
				trigger: section,
				start: "top top",
				end: "+=100%",
				pin: true,
				pinSpacing: true,
				markers: true
			});

			// 2️⃣ 내부 텍스트 등장 애니메이션
			const leftText = section.querySelector(".text.left");
			const rightText = section.querySelector(".text.right");

			gsap.fromTo(leftText,
				{ x: -150, y: 100, opacity: 0 },
				{
					x: 0,
					y: 0,
					opacity: 1,
					scrollTrigger: {
						trigger: ".section",
						start: "center 90%",
						end: "bottom top",
						scrub: true,
						// markers: true
					}
				}
			);

			gsap.fromTo(rightText,
				{ x: 150, y: 150, opacity: 0 },
				{
					x: 0,
					y: 0,
					opacity: 1,
					scrollTrigger: {
						trigger: ".section",
						start: "top center",
						end: "bottom top",
						scrub: true,
						markers: true
					}
				}
			);
		});

	</script>
</body>

</html>
