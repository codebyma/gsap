<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>GSAP ScrollTrigger Sample</title>
	<style>
		body {
			margin: 0;
			height: 200vh;
			font-family: sans-serif;
		}

		section {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #111;
			color: white;
		}

		.box {
			width: 150px;
			height: 150px;
			background: #4ade80;
		}

		.text {

			font-size: 16px;
			color: #fff
		}

		.spacer {
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2rem;
		}

		.section {
			/* border-top: 10px solid #fff */
		}

		.horizontal-section {
			position: relative;
			height: 100vh;
			overflow: hidden;
			background: #222;
			color: #fff;
			display: flex;
			align-items: center;
		}

		.list-wrapper {
			display: flex;
			width: 500%;
			/* 아이템 개수에 맞춰 충분히 늘리기 */
		}

		.item {
			flex: 0 0 50%;
			/* 5개 아이템이면 20%씩 */
			height: 300px;
			margin: 0 10px;
			background: #4ade80;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2rem;
		}

		.box2 {
			width: 150px;
			height: 100px;
			background: #4ade80;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #111;
			font-size: 2rem;
			transform: translateY(50px);
			/* 초기 아래 위치 */
			opacity: 0;
			/* 초기 투명 */
		}
	</style>
</head>

<body>

	<section class="timeline-section">
		<div class="box2">1</div>
		<div class="box2">2</div>
		<div class="box2">3</div>
	</section>


	<section>
		<h1>스크롤 내려보세요 ↓</h1>
	</section>


	<section class="section2">
		<p class="text left2">왼쪽에서 등장</p>
	</section>

	<section class="section">
		<div class="text-wrapper">
			<p class="text left">왼쪽에서 등장</p>
			<p class="text left">왼쪽에서 등장</p>
			<p class="text left">왼쪽에서 등장</p>
			<p class="text left">왼쪽에서 등장</p>
			<p class="text right">오른쪽에서 등장</p>
		</div>
	</section>

	<section class="horizontal-section">
		<div class="list-wrapper">
			<div class="item">1</div>
			<div class="item">2</div>
			<div class="item">3</div>
			<div class="item">4</div>
			<div class="item">5</div>
		</div>
	</section>

	<section class="trigger">
		<div class="box"></div>
	</section>

	<div class="spacer">끝</div>

	<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
	<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
	<script>
		gsap.registerPlugin(ScrollTrigger);

		// 로딩되자마자 순차적 애니메이션
		const boxes = document.querySelectorAll(".timeline-section .box2");

		// Timeline 생성
		const tl = gsap.timeline({
			defaults: {
				duration: 1, ease: "power2.out"
			}
		});

		// 순차적으로 아래 → 위로 등장
		boxes.forEach((box, index) => {
			tl.to(box, {
				y: 0,       // 원래 위치로 이동
				opacity: 1, // 나타나기
			}, index * 0.3); // index * 0.3초 딜레이로 순차 등장
		});




		gsap.to(".box", {
			x: 400,
			rotation: 360,
			scale: 1.5,
			scrollTrigger: {
				trigger: ".trigger",   // 기준 요소
				start: "top center",   // 트리거 시작 지점
				end: "bottom top",     // 트리거 끝 지점
				scrub: true,           // 스크롤과 애니메이션 동기화
				pin: true,             // 섹션 고정
				//markers: true          // 개발용 마커 (배포 시 제거)
			}
		});


		
		// 단독
		gsap.fromTo('.left2',
			{ x: 150, y: 150, opacity: 0 },
			{
				x: 0,
				y: 0,
				opacity: 1,
				scrollTrigger: {
					trigger: '.section2',
					start: "top 80%",
					end: "bottom top",
					scrub: true,
					// markers: true
				}
			}
		);


		gsap.utils.toArray(".section").forEach(section => {
			// 1️⃣ section 전체 pin
			ScrollTrigger.create({
				trigger: section,
				start: "top top",
				end: "+=100%",
				pin: true,
				pinSpacing: true,
				markers: true
			});

			// 2️⃣ 내부 텍스트 등장 애니메이션
			const leftText = section.querySelector(".text.left");
			const rightText = section.querySelector(".text.right");

			// 섹션 안의 모든 왼쪽 텍스트
			const leftTexts = section.querySelectorAll(".text.left");
			leftTexts.forEach(el => {
				gsap.fromTo(el,
					{ x: -150, y: 100, opacity: 0 },
					{
						x: 0,
						y: 0,
						opacity: 1,
						scrollTrigger: {
							trigger: el, // 각 요소 기준으로
							start: "top 90%",
							end: "bottom top",
							scrub: true,
							// markers: true
						}
					}
				);
			});

			/* gsap.fromTo(leftText,
				{ x: -150, y: 100, opacity: 0 },
				{
					x: 0,
					y: 0,
					opacity: 1,
					scrollTrigger: {
						trigger: ".section",
						start: "center 90%",
						end: "bottom top",
						scrub: true,
						// markers: true
					}
				}
			);
 */
			gsap.fromTo(rightText,
				{ x: 150, y: 150, opacity: 0 },
				{
					x: 0,
					y: 0,
					opacity: 1,
					scrollTrigger: {
						trigger: ".section",
						start: "top center",
						end: "bottom top",
						scrub: true,
						markers: true
					}
				}
			);
		});


		const horizontalSection = document.querySelector(".horizontal-section");
		const listWrapper = horizontalSection.querySelector(".list-wrapper");

		gsap.to(listWrapper, {
			x: () => `-${listWrapper.scrollWidth - horizontalSection.clientWidth}px`, // 오른쪽 끝까지 이동
			ease: "none",
			scrollTrigger: {
				trigger: horizontalSection,
				start: "top top",
				end: () => `+=${listWrapper.scrollWidth}`, // 스크롤 길이 = 컨텐츠 너비
				pin: true,
				scrub: true,
				// markers: true
			}
		});


		
	</script>
</body>

</html>
