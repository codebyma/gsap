<template>
  <section class="intro">
    <h2 class="title1">
      <span data-tl="bTot" data-delay="1">WEB</span>
      <span data-tl="tTob" data-delay="2">PUBLISHER</span>
    </h2>
    <p class="detail t_blue" data-tl="bTot" data-delay="3">
      완성도를 위해 끊임없이 개선하고<br />
      문제 해결을 통해 스스로를 단련해온 인재
    </p>
    <p class="profile" data-tl="tTob" data-delay="4">AAA</p>
  </section>

  <section class="project">
    <div data-ani>
      <p class="t_orange" data-ani="bTot">Career Description</p>
      <h2 class="title1 mgt0" data-ani="bTot">경력 기술서</h2>
    </div>

    <ul class="project_group">
      <li class="project_item" data-ani>
        <h2 class="title2" data-ani="bTot">
          React <small class="t_blue">(2026)</small>
        </h2>
        <h3 class="title3" data-ani="bTot">Hook1</h3>
        <p data-ani="bTot">
          함수형 컴포넌트에서 상태와 생명주기 기능을 사용할 수 있도록 도와주는 기능입니다.
        </p>
      </li>
    </ul>
  </section>

  <section class="skills">
    <div data-ani>
      <p class="t_orange" data-ani="bTot">SKILLS</p>
      <h2 class="title1 mgt0" data-ani="bTot">기술</h2>
    </div>

    <div class="skill-group">
      <ul class="skill-list">
        <li class="skill is-featured" data-percent="90">
          <span class="name">HTML5</span>
          <span class="percent">90%</span>
          <div class="bar"><span /></div>
        </li>
        <li class="skill">SCSS</li>
        <li class="skill">Responsive</li>
      </ul>
    </div>
  </section>

  <section class="pin-section" ref="pinSection">
    <p class="text-item t2">완성도와 문제 정의부터</p>
    <p class="text-item t2">개선까지 책임해온 퍼블리셔로,</p>
    <p class="text-item t_orange">협업해온 인재</p>
  </section>
</template>

<script setup>
import { onMounted, onBeforeUnmount, ref } from "vue";
import gsap from "gsap";
import ScrollTrigger from "gsap/ScrollTrigger";

gsap.registerPlugin(ScrollTrigger);

const pinSection = ref(null);

onMounted(() => {
  /* --------------------
    data-ani 스크롤 애니메이션
  -------------------- */
  document.querySelectorAll("[data-ani]").forEach((item) => {
    gsap.fromTo(
      item.querySelectorAll("[data-ani='bTot']"),
      { y: 50, opacity: 0 },
      {
        y: 0,
        opacity: 1,
        stagger: 0.1,
        scrollTrigger: {
          trigger: item,
          start: "top 70%",
          end: "top 30%",
          scrub: true,
        },
      }
    );
  });

  /* --------------------
    스킬 퍼센트 바
  -------------------- */
  gsap.utils.toArray(".skill-group").forEach((group) => {
    const items = group.querySelectorAll(".skill");

    gsap.to(items, {
      scrollTrigger: {
        trigger: group,
        start: "top 80%",
      },
      opacity: 1,
      y: 0,
      duration: 0.6,
      stagger: 0.08,
    });

    group.querySelectorAll(".is-featured").forEach((skill) => {
      const percent = skill.dataset.percent;
      const bar = skill.querySelector(".bar span");

      gsap.to(bar, {
        scrollTrigger: {
          trigger: skill,
          start: "top 85%",
        },
        width: percent + "%",
        duration: 1,
        delay: 0.5,
      });
    });
  });

  /* --------------------
    Pin Section
  -------------------- */
  gsap.timeline({
    scrollTrigger: {
      trigger: pinSection.value,
      start: "top top",
      end: () => "+=" + pinSection.value.scrollHeight * 0.7,
      pin: true,
      scrub: 0.6,
    },
  }).fromTo(
    ".text-item",
    { y: 20, opacity: 0 },
    { y: 0, opacity: 1, stagger: 0.2 }
  );

  /* --------------------
    Intro 로딩 애니메이션
  -------------------- */
  const tl = gsap.timeline({ defaults: { duration: 1, ease: "sine.out" } });

  document.querySelectorAll("[data-tl]").forEach((item) => {
    tl.to(
      item,
      { opacity: 1, x: 0, y: 0 },
      item.dataset.delay / 10
    );
  });
});

onBeforeUnmount(() => {
  ScrollTrigger.getAll().forEach((st) => st.kill());
});
</script>
